# 每个 PR 推了新提交、每次合进 main：跑全部测试，把每个界面截成图（浅色、深色）。
# PR 上贴一条评论（每次更新它）：测试结果、和 main 比哪些界面变了、全部截图。
# 截图按内容存在 ui-shots 分支；main 的那一份是 PR 比较的底。
# 全部 job 跑在自托管的一次性 macOS 虚拟机里（标签 luoke-vm），同时最多 2 台，忙时排队。
# 截图、推 ui-shots、贴评论在同一个 job 里做完，不经过 Actions 制品（artifact）：
# 免费额度下制品和 Packages 共用存储，截图包曾把当月额度用光。
# 从别人 fork 来的 PR 没有写权限：照样跑测试和截图，结果只在运行日志里，不推截图、不评论。
name: 测试和截图

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: [self-hosted, luoke-vm]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            flags: ""
          - python: "3.12"
            flags: "-W error::ResourceWarning"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -B ${{ matrix.flags }} -m unittest discover -s tests -t .

  swift:
    name: Swift 测试和截图
    # 要 Python 的结果写进评论，所以排在它后面；Python 没过也照样跑
    needs: [python]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, luoke-vm]
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    env:
      OUT: ${{ github.workspace }}/.tmp/ci
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          # 令牌只给「贴截图」这一步，不留在 .git/config 里给前面跑的代码
          persist-credentials: false
      - name: 工具链
        run: |
          sw_vers
          swift --version
      - name: LuokeA2UI
        run: scripts/ci/step.sh "$OUT" LuokeA2UI a2ui.log swift test --package-path a2ui
      - name: LuokeWindow
        if: ${{ !cancelled() }}
        run: scripts/ci/step.sh "$OUT" LuokeWindow window.log swift test --package-path window
      - name: 截图
        if: ${{ !cancelled() }}
        run: scripts/ci/step.sh "$OUT" 截图 shots.log swift run --package-path window luoke-window-shots "$OUT/shots"
      - name: 贴截图
        # 测试没过也贴；fork 来的 PR 跳过（见文件头）
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.pull_request.number || 'main' }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: >
          python3 -B scripts/ci/post_shots.py
          --run .tmp/ci --work "$RUNNER_TEMP/ui-shots"
          --target "$TARGET" --sha "$HEAD_SHA" --repo "$GITHUB_REPOSITORY"
          --python "$PYTHON_RESULT"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
